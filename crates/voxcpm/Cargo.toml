[package]
name = "voxcpm"
version = "0.1.0"
edition = "2021"

[features]
# Forward Candle backend features so examples can use Device::new_cuda().
cuda = ["candle-core/cuda", "candle-nn/cuda"]
metal = ["candle-core/metal", "candle-nn/metal"]
mkl = ["candle-core/mkl", "candle-nn/mkl"]
accelerate = ["candle-core/accelerate", "candle-nn/accelerate"]

[lib]
path = "src/lib.rs"

[dependencies]
candle-core = "0.9"
candle-nn = "0.9"
hound = "3"
rand = "0.8"
rand_chacha = "0.3"
rand_distr = "0.4"
rubato = "0.16"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokenizers = { version = "0.15", default-features = false, features = ["onig"] }

[dev-dependencies]
safetensors = "0.4"
