[package]
name = "voxcpm_desktop"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
tokio = { version = "1", features = ["sync", "time"] }
voxcpm_engine_sdk = { path = "../../voxcpm_engine_sdk", features = ["tauri-shell"] }
voxcpm_ipc = { path = "../../voxcpm_ipc" }
