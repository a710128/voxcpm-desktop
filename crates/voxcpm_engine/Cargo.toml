[package]
name = "voxcpm_engine"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "engine"
path = "src/main.rs"

[features]
cuda = ["voxcpm/cuda", "dep:cudarc"]
metal = ["voxcpm/metal", "candle-core/metal", "dep:candle-metal-kernels"]

[dependencies]
bytes = "1"
candle-core = "0.9"
candle-metal-kernels = { version = "0.9.2", optional = true }
cudarc = { version = "0.19.2", optional = true }
futures-util = "0.3"
hound = "3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
symphonia = { version = "0.5.4", default-features = false, features = ["aac", "flac", "isomp4", "mp3", "pcm", "wav"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "io-util", "time", "fs", "io-std"] }
voxcpm = { path = "../voxcpm" }
voxcpm_ipc = { path = "../voxcpm_ipc" }
