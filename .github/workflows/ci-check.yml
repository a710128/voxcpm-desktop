name: CI Check

on:
  push:
  pull_request:

concurrency:
  group: ci-check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      # Some dependencies (e.g. ring) rely on Apple AArch64 baseline target features.
      # Keep any target-specific flags localized to the matrix.
      RUSTFLAGS: ${{ matrix.rustflags || '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
          - os: windows-latest
          - os: macos-14
            rustflags: '-C target-cpu=apple-m1'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target

      - name: Install Linux system deps (Tauri)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libfuse2

      - name: Setup MSVC (cl.exe)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Pin MSVC linker (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          # Ensure Cargo/rustc uses MSVC's linker, not Git-for-Windows' GNU link.exe.
          $allLinks = Get-Command link.exe -All | Select-Object -ExpandProperty Source
          $msvcLink = $allLinks | Where-Object { $_ -match '\\VC\\Tools\\MSVC\\' } | Select-Object -First 1
          if (-not $msvcLink) {
            throw "MSVC link.exe not found. Candidates: $($allLinks -join '; ')"
          }

          "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=$msvcLink" | Out-File -FilePath $env:GITHUB_ENV -Append
          "CC=cl.exe" | Out-File -FilePath $env:GITHUB_ENV -Append
          "CXX=cl.exe" | Out-File -FilePath $env:GITHUB_ENV -Append

          Write-Host "Pinned MSVC linker: $msvcLink"
          where.exe link.exe

      - name: Cargo check (workspace)
        run: cargo check --workspace

      - name: Cargo check (voxcpm_engine_sdk + tauri-shell)
        run: cargo check -p voxcpm_engine_sdk --features tauri-shell
