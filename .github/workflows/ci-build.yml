name: ci-build

on:
  release:
    types: [published]

concurrency:
  group: ci-build-${{ github.event.release.tag_name }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runs_on }}
    env:
      # Some dependencies (e.g. ring) rely on Apple AArch64 baseline target features.
      # Apply any target-specific flags via matrix to keep changes localized.
      RUSTFLAGS: ${{ matrix.rustflags || '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows
          - name: windows-x64-cpu
            runs_on: windows-latest
            variant: cpu
            rust_target: x86_64-pc-windows-msvc
            exe_ext: .exe
            engine_features: ''
            bundles: nsis
            install_cuda: false

          - name: windows-x64-cuda12_4
            runs_on: windows-2022
            variant: cuda12_4
            rust_target: x86_64-pc-windows-msvc
            exe_ext: .exe
            engine_features: cuda
            bundles: nsis
            install_cuda: true
            cuda_version: '12.4.1'
            cuda_compute_cap: '61'
            candle_cuda_arch_list: '61,70,75,80,86,89,90'
            candle_cuda_ptx_arch: '61'

          # Linux
          - name: linux-x64-cpu
            runs_on: ubuntu-22.04
            variant: cpu
            rust_target: x86_64-unknown-linux-gnu
            exe_ext: ''
            engine_features: ''
            bundles: appimage
            install_cuda: false

          - name: linux-x64-cuda12_2
            runs_on: ubuntu-22.04
            variant: cuda12_2
            rust_target: x86_64-unknown-linux-gnu
            exe_ext: ''
            engine_features: cuda
            bundles: appimage
            install_cuda: true
            cuda_compute_cap: '61'
            candle_cuda_arch_list: '61,70,75,80,86,89,90'
            candle_cuda_ptx_arch: '61'

          # macOS (split by arch)
          - name: macos-arm64-metal
            runs_on: macos-14
            variant: metal
            rust_target: aarch64-apple-darwin
            exe_ext: ''
            engine_features: metal
            bundles: dmg
            install_cuda: false
            rustflags: '-C target-cpu=apple-m1'

          - name: macos-x64-metal
            runs_on: macos-15-intel
            variant: metal
            rust_target: x86_64-apple-darwin
            exe_ext: ''
            engine_features: metal
            bundles: dmg
            install_cuda: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: crates/voxcpm_desktop/package-lock.json

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Diagnostics (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euxo pipefail
          rustc -Vv
          cargo -Vv
          echo "RUSTFLAGS=${RUSTFLAGS-}"
          echo "CARGO_ENCODED_RUSTFLAGS=${CARGO_ENCODED_RUSTFLAGS-}"
          echo "TARGET=${{ matrix.rust_target }}"
          # ring relies on Rust target_feature cfg on Apple AArch64.
          rustc --print cfg --target "${{ matrix.rust_target }}" | grep '^target_feature=' || true

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            crates/voxcpm_desktop/src-tauri -> crates/voxcpm_desktop/src-tauri/target

      - name: Install Linux system deps (Tauri)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libfuse2

      - name: Install CUDA Toolkit (for CUDA variants)
        if: ${{ matrix.install_cuda }}
        uses: Jimver/cuda-toolkit@v0.2.30
        with:
          cuda: ${{ matrix.cuda_version || '12.2.0' }}
          method: 'network'
          log-file-suffix: '${{ matrix.name }}.txt'

      - name: Print CUDA environment
        if: ${{ matrix.install_cuda }}
        shell: bash
        run: |
          echo "CUDA_PATH=${CUDA_PATH}"
          nvcc -V || true

      - name: Setup MSVC (cl.exe)
        if: ${{ runner.os == 'Windows' }}
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Pin MSVC linker (Windows)
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          # Ensure Cargo/rustc uses MSVC's linker, not Git-for-Windows' GNU link.exe.
          $allLinks = Get-Command link.exe -All | Select-Object -ExpandProperty Source
          $msvcLink = $allLinks | Where-Object { $_ -match '\\VC\\Tools\\MSVC\\' } | Select-Object -First 1
          if (-not $msvcLink) {
            throw "MSVC link.exe not found. Candidates: $($allLinks -join '; ')"
          }

          "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=$msvcLink" | Out-File -FilePath $env:GITHUB_ENV -Append
          "CC=cl.exe" | Out-File -FilePath $env:GITHUB_ENV -Append
          "CXX=cl.exe" | Out-File -FilePath $env:GITHUB_ENV -Append

          Write-Host "Pinned MSVC linker: $msvcLink"
          where.exe link.exe

      - name: Configure nvcc host compiler (Windows CUDA)
        if: ${{ runner.os == 'Windows' && matrix.install_cuda }}
        shell: pwsh
        run: |
          "NVCC_CCBIN=cl.exe" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Install frontend dependencies
        run: npm ci
        working-directory: crates/voxcpm_desktop

      - name: Install Tauri CLI (cargo tauri)
        run: cargo install tauri-cli --version 2.0.0 --locked

      - name: Build engine (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          CUDA_COMPUTE_CAP: ${{ matrix.cuda_compute_cap || '' }}
          CANDLE_CUDA_ARCH_LIST: ${{ matrix.candle_cuda_arch_list || '' }}
          CANDLE_CUDA_PTX_ARCH: ${{ matrix.candle_cuda_ptx_arch || '' }}
        run: |
          $ErrorActionPreference = 'Stop'
          # Git Bash ships a GNU link.exe that can shadow the MSVC linker in PATH.
          $env:PATH = ($env:PATH -split ';' | Where-Object { $_ -notmatch '\\Git\\usr\\bin\\?$' }) -join ';'
          $features = "${{ matrix.engine_features }}"
          if ($features) {
            cargo build -p voxcpm_engine --bin engine --release --target "${{ matrix.rust_target }}" --features "$features"
          } else {
            cargo build -p voxcpm_engine --bin engine --release --target "${{ matrix.rust_target }}"
          }

      - name: Build engine (Unix)
        if: runner.os != 'Windows'
        shell: bash
        env:
          CUDA_COMPUTE_CAP: ${{ matrix.cuda_compute_cap || '' }}
          CANDLE_CUDA_ARCH_LIST: ${{ matrix.candle_cuda_arch_list || '' }}
          CANDLE_CUDA_PTX_ARCH: ${{ matrix.candle_cuda_ptx_arch || '' }}
        run: |
          set -euxo pipefail
          FEATURES="${{ matrix.engine_features }}"
          if [[ -n "$FEATURES" ]]; then
            cargo build -p voxcpm_engine --bin engine --release --target "${{ matrix.rust_target }}" --features "$FEATURES"
          else
            cargo build -p voxcpm_engine --bin engine --release --target "${{ matrix.rust_target }}"
          fi

      - name: Bundle engine as Tauri sidecar (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $binDir = 'crates/voxcpm_desktop/src-tauri/binaries'
          New-Item -ItemType Directory -Force -Path $binDir | Out-Null
          $src = "target/${{ matrix.rust_target }}/release/engine${{ matrix.exe_ext }}"
          $dst = "$binDir/engine-${{ matrix.rust_target }}${{ matrix.exe_ext }}"
          Copy-Item -Force $src $dst

      - name: Bundle engine as Tauri sidecar (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euxo pipefail
          BIN_DIR="crates/voxcpm_desktop/src-tauri/binaries"
          mkdir -p "$BIN_DIR"
          SRC="target/${{ matrix.rust_target }}/release/engine${{ matrix.exe_ext }}"
          DST="$BIN_DIR/engine-${{ matrix.rust_target }}${{ matrix.exe_ext }}"
          cp "$SRC" "$DST"

      - name: Fetch CUDA redist libs (Windows CUDA 12.4)
        if: ${{ runner.os == 'Windows' && matrix.variant == 'cuda12_4' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python tools/fetch_cuda_redist.py \
            --cuda-minor 12.4 \
            --platform windows-x86_64 \
            --out-dir crates/voxcpm_desktop/src-tauri/resources/cuda/win-x64-cuda12.4 \
            --components cuda_cudart libcublas libcurand

      - name: Fetch CUDA redist libs (Linux CUDA 12.2)
        if: ${{ runner.os == 'Linux' && matrix.variant == 'cuda12_2' }}
        shell: bash
        run: |
          set -euxo pipefail
          python3 tools/fetch_cuda_redist.py \
            --cuda-minor 12.2 \
            --platform linux-x86_64 \
            --out-dir crates/voxcpm_desktop/src-tauri/resources/cuda/linux-x64-cuda12.2 \
            --components cuda_cudart libcublas libcurand

      - name: Build Tauri bundle (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Avoid GNU link.exe from Git Bash.
          $env:PATH = ($env:PATH -split ';' | Where-Object { $_ -notmatch '\\Git\\usr\\bin\\?$' }) -join ';'
          cargo tauri build --target "${{ matrix.rust_target }}" --bundles "${{ matrix.bundles }}"
        working-directory: crates/voxcpm_desktop/src-tauri

      - name: Build Tauri bundle (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euxo pipefail
          cargo tauri build --target "${{ matrix.rust_target }}" --bundles "${{ matrix.bundles }}"
        working-directory: crates/voxcpm_desktop/src-tauri

      - name: Upload release asset (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = "${{ github.event.release.tag_name }}"
          $version = $tag -replace '^v',''
          $bundleDir = "crates/voxcpm_desktop/src-tauri/target/${{ matrix.rust_target }}/release/bundle/nsis"
          $exe = Get-ChildItem -Path $bundleDir -Filter *.exe | Select-Object -First 1
          if (-not $exe) { throw "NSIS bundle not found in $bundleDir" }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $asset = "VoxCPM_Desktop-$version-${{ matrix.name }}.exe"
          Copy-Item -Force $exe.FullName (Join-Path dist $asset)
          gh release upload "$tag" (Join-Path dist $asset) --clobber --repo "${{ github.repository }}"

      - name: Upload release asset (macOS)
        if: runner.os == 'macOS'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          TAG='${{ github.event.release.tag_name }}'
          VERSION="${TAG#v}"
          DMG_PATH=$(ls -1 crates/voxcpm_desktop/src-tauri/target/${{ matrix.rust_target }}/release/bundle/dmg/*.dmg | head -n 1)
          mkdir -p dist
          ASSET="VoxCPM_Desktop-${VERSION}-${{ matrix.name }}.dmg"
          cp -f "$DMG_PATH" "dist/$ASSET"
          gh release upload "$TAG" "dist/$ASSET" --clobber --repo "${{ github.repository }}"

      - name: Upload release asset (Linux)
        if: runner.os == 'Linux'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          TAG='${{ github.event.release.tag_name }}'
          VERSION="${TAG#v}"
          APPIMAGE_PATH=$(ls -1 crates/voxcpm_desktop/src-tauri/target/${{ matrix.rust_target }}/release/bundle/appimage/*.AppImage | head -n 1)
          mkdir -p dist
          ASSET="VoxCPM_Desktop-${VERSION}-${{ matrix.name }}.AppImage"
          cp -f "$APPIMAGE_PATH" "dist/$ASSET"
          gh release upload "$TAG" "dist/$ASSET" --clobber --repo "${{ github.repository }}"
