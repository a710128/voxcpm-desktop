name: ci-build

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-build-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  TAURI_CLI_VERSION: '2.0.0'

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runs_on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows
          - name: windows-x64-cpu
            runs_on: windows-latest
            variant: cpu
            rust_target: x86_64-pc-windows-msvc
            exe_ext: .exe
            engine_features: ''
            bundles: nsis
            install_cuda: false

          - name: windows-x64-cuda12_2
            runs_on: windows-latest
            variant: cuda12_2
            rust_target: x86_64-pc-windows-msvc
            exe_ext: .exe
            engine_features: cuda
            bundles: nsis
            install_cuda: true
            cuda_compute_cap: '61'
            candle_cuda_arch_list: '61,70,75,80,86,89,90'
            candle_cuda_ptx_arch: '61'

          # Linux
          - name: linux-x64-cpu
            runs_on: ubuntu-22.04
            variant: cpu
            rust_target: x86_64-unknown-linux-gnu
            exe_ext: ''
            engine_features: ''
            bundles: appimage
            install_cuda: false

          - name: linux-x64-cuda12_2
            runs_on: ubuntu-22.04
            variant: cuda12_2
            rust_target: x86_64-unknown-linux-gnu
            exe_ext: ''
            engine_features: cuda
            bundles: appimage
            install_cuda: true
            cuda_compute_cap: '61'
            candle_cuda_arch_list: '61,70,75,80,86,89,90'
            candle_cuda_ptx_arch: '61'

          # macOS (split by arch)
          - name: macos-arm64-metal
            runs_on: macos-14
            variant: metal
            rust_target: aarch64-apple-darwin
            exe_ext: ''
            engine_features: metal
            bundles: dmg
            install_cuda: false

          - name: macos-x64-metal
            runs_on: macos-15-intel
            variant: metal
            rust_target: x86_64-apple-darwin
            exe_ext: ''
            engine_features: metal
            bundles: dmg
            install_cuda: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: crates/voxcpm_desktop/package-lock.json

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Diagnostics (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euxo pipefail
          rustc -Vv
          cargo -Vv
          echo "RUSTFLAGS=${RUSTFLAGS-}"
          echo "CARGO_ENCODED_RUSTFLAGS=${CARGO_ENCODED_RUSTFLAGS-}"
          echo "TARGET=${{ matrix.rust_target }}"
          # ring relies on Rust target_feature cfg on Apple AArch64.
          rustc --print cfg --target "${{ matrix.rust_target }}" | grep '^target_feature=' || true

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            crates/voxcpm_desktop/src-tauri -> crates/voxcpm_desktop/src-tauri/target

      - name: Install Linux system deps (Tauri)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libfuse2

      - name: Install CUDA Toolkit (for CUDA variants)
        if: ${{ matrix.install_cuda }}
        uses: Jimver/cuda-toolkit@v0.2.30
        with:
          cuda: '12.2.0'
          method: 'network'
          log-file-suffix: '${{ matrix.name }}.txt'

      - name: Print CUDA environment
        if: ${{ matrix.install_cuda }}
        shell: bash
        run: |
          echo "CUDA_PATH=${CUDA_PATH}"
          nvcc -V || true

      - name: Install frontend dependencies
        run: npm ci
        working-directory: crates/voxcpm_desktop

      - name: Cache Tauri CLI
        id: cache-tauri-cli
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/cargo-tauri
            ~/.cargo/bin/cargo-tauri.exe
            ~/.cargo/bin/tauri
            ~/.cargo/bin/tauri.exe
          key: tauri-cli-${{ runner.os }}-${{ env.TAURI_CLI_VERSION }}

      - name: Install Tauri CLI (cargo tauri)
        if: steps.cache-tauri-cli.outputs.cache-hit != 'true'
        run: cargo install tauri-cli --version "${TAURI_CLI_VERSION}" --locked

      - name: Build engine
        shell: bash
        env:
          CUDA_COMPUTE_CAP: ${{ matrix.cuda_compute_cap || '' }}
          CANDLE_CUDA_ARCH_LIST: ${{ matrix.candle_cuda_arch_list || '' }}
          CANDLE_CUDA_PTX_ARCH: ${{ matrix.candle_cuda_ptx_arch || '' }}
        run: |
          set -euxo pipefail
          FEATURES="${{ matrix.engine_features }}"
          if [[ -n "$FEATURES" ]]; then
            cargo build -p voxcpm_engine --bin engine --release --target "${{ matrix.rust_target }}" --features "$FEATURES"
          else
            cargo build -p voxcpm_engine --bin engine --release --target "${{ matrix.rust_target }}"
          fi

      - name: Bundle engine as Tauri sidecar
        shell: bash
        run: |
          set -euxo pipefail
          BIN_DIR="crates/voxcpm_desktop/src-tauri/binaries"
          mkdir -p "$BIN_DIR"
          SRC="target/${{ matrix.rust_target }}/release/engine${{ matrix.exe_ext }}"
          DST="$BIN_DIR/engine-${{ matrix.rust_target }}${{ matrix.exe_ext }}"
          cp "$SRC" "$DST"

      - name: Build Tauri bundle
        shell: bash
        run: |
          set -euxo pipefail
          cargo tauri build --target "${{ matrix.rust_target }}" --bundles "${{ matrix.bundles }}"
        working-directory: crates/voxcpm_desktop/src-tauri

      - name: Upload bundle artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VoxCPM_Desktop-${{ matrix.name }}
          if-no-files-found: error
          retention-days: 7
          path: |
            crates/voxcpm_desktop/src-tauri/target/**/release/bundle/**
